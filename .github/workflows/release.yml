name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# contents 用于建 tag + GitHub Release。
permissions:
  contents: read

jobs:
  # 门：发布前再跑一遍测试，红则不发。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm install
      - run: python -m pip install pytest
      - run: npx tsc -p tsconfig.json
      # 编译产物必须与源码一致，否则发布出去的是旧代码。
      - run: |
          if ! git diff --quiet -- lib/; then
            echo "::error::lib/ is stale -- rebuild and commit the artifact"
            exit 1
          fi
      - run: node tests/functional.mjs
      - run: python -m pytest tests/test_decision_gate.py tests/test_exempt.py tests/test_analyze.py -q

  release:
    runs-on: ubuntu-latest
    needs: verify
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build | Pack tarball
        run: |
          npm pack
          ls -1 *.tgz

      # 版本号取自 package.json——它是唯一真源（见 AGENT.md 发布纪律第 17 条）。
      # tag 已存在则跳过，不覆盖已发布的版本。
      - name: Publish | GitHub Release with the tarball attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          TARBALL="$(ls -1 *.tgz | head -1)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          gh release create "$TAG" "$TARBALL" \
            --title "$TAG" \
            --generate-notes
