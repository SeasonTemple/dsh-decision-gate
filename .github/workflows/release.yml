name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# contents 用于建 tag + GitHub Release。
permissions:
  contents: read

jobs:
  # 门：发布前再跑一遍测试，红则不发。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm install
      - run: python -m pip install pytest
      - run: npx tsc -p tsconfig.json
      # 编译产物必须与源码一致，否则发布出去的是旧代码。
      - run: |
          if ! git diff --quiet -- lib/; then
            echo "::error::lib/ is stale -- rebuild and commit the artifact"
            exit 1
          fi
      - run: node tests/functional.mjs
      - run: python -m pytest tests/test_decision_gate.py tests/test_exempt.py tests/test_analyze.py -q

  release:
    runs-on: ubuntu-latest
    needs: verify
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build | Pack tarball
        run: |
          npm pack
          ls -1 *.tgz

      - name: Setup | Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 版本号取自 package.json——它是唯一真源（见 AGENT.md 发布纪律第 17 条）。
      # tag 已存在则跳过，不覆盖已发布的版本。
      - name: Publish | GitHub Release with the tarball attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          TARBALL="$(ls -1 *.tgz | head -1)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          gh release create "$TAG" "$TARBALL" \
            --title "$TAG" \
            --generate-notes

      # 发布说明是写出来的，不是生成出来的。docs/release-notes/<tag>.md 是
      # 唯一真源；缺文件时保留自动 notes 并告警（exit 0），文件存在但取不到标题
      # 时算质量门失败（exit 1）——发布路径上不许有静默降级。
      # 必须在 release 建好之后跑：gh release edit 对不存在的 release 直接失
      # 败——这个顺序 bug 让 0.5.1 的首次发布红过一次（release not found）。
      - name: Publish | Curated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTE="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTE" ]; then
            echo "::warning::no curated note at $NOTE; falling back to auto-generated notes"
            exit 0
          fi
          TITLE="$(python tools/release_notes.py title "$NOTE")"
          echo "curated note: $NOTE"
          echo "title: $TITLE"
          gh release edit "$TAG" --notes-file "$NOTE" --title "$TITLE"
